# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage
# If it has the same name as one of the files in folder `_data/locales`,
# the layout language will also be changed.
lang: en

# Change to your timezone
timezone:

# jekyll-seo-tag settings
# ↓ --------------------------

title: Asif Nawaz Minhas # the main title

tagline: Sharing my journey in cybersecurity, red teaming, and AI # it will display as the subtitle

description: >-
  A minimal, responsive and feature-rich Jekyll theme for technical writing.

# Fill in the protocol & hostname for your site.
# It should not end with a '/'.
url: "https://www.asifnawazminhas.com"

github:
  username: asifnawazminhas

# twitter:
#   username: twitter_username

social:
  # Default author of the posts and copyright owner in the footer
  name: Asif Nawaz Minhas

  links:
    # The first element serves as the copyright owner's link
    - https://www.linkedin.com/in/asifminhasnl/
    - https://github.com/asifnawazminhas
    - https://notes.asifnawazminhas.com

# Site Verification Settings
webmaster_verifications:
  google: # fill in your Google verification code
  bing: # fill in your Bing verification code
  alexa: # fill in your Alexa verification code
  yandex: # fill in your Yandex verification code
  baidu: # fill in your Baidu verification code
  facebook: # fill in your Facebook verification code

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings


# Web Analytics Settings
analytics:
  google:
    id: # fill in your Google Analytics ID

  goatcounter:
    id: # fill in your GoatCounter ID

  umami:
    id: # fill in your Umami ID
    domain: # fill in your Umami domain

  matomo:
    id: # fill in your Matomo ID
    domain: # fill in your Matomo domain

  cloudflare:
    id: # fill in your Cloudflare Web Analytics token

  fathom:
    id: # fill in your Fathom Site ID


# Page views settings
pageviews:
  provider: # now only supports 'goatcounter'


# Prefer color scheme setting.
#
# Keep empty to follow the system preference by default.
#
# Available options:
#
#     light
#     dark
#
theme_mode: dark


# The CDN endpoint for media resources.
cdn:


# The avatar on sidebar
avatar: /assets/img/thinking.png

# Site favicon
favicon: /assets/img/favicons/favicon.ico


# The URL of the site-wide social preview image used in SEO `og:image`.
# It can be overridden by a customized `page.image` in front matter.
social_preview_image:


# Global switch for TOC in posts.
toc: true


# Comments
comments:
  # Global switch for the post-comment system.
  # Keeping it empty means disabled.
  provider: # [disqus | utterances | giscus]

  # Disqus
  disqus:
    shortname:

  # Utterances
  utterances:
    repo:
    issue_term:

  # Giscus
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:


# Self-hosted static assets
assets:
  self_host:
    enabled:
    env:


# Plugins
plugins:
  - jemoji


# Progressive Web App
pwa:
  enabled: true

  cache:
    enabled: true

    # Paths defined here will be excluded from the PWA cache.
    deny_paths:
      # - "/example"


# Pagination
paginate: 10


# The base URL of your site
baseurl: ""


# -------------------------------------------------------------------
# The following options are not recommended to be modified
# -------------------------------------------------------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge

  syntax_highlighter_opts:
    css_class: highlight

    # default_lang: console

    span:
      line_numbers: false

    block:
      line_numbers: true
      start_line: 1


# Collections
collections:
  tabs:
    output: true
    sort_by: order


# Default front matter values
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true

      # DO NOT modify unless you are confident enough
      # to update all existing post links.
      permalink: /posts/:title/

  - scope:
      path: _drafts
    values:
      comments: false

  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/


# Sass
sass:
  style: compressed


# HTML compression
compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false

  ignore:
    envs: [development]


# Files and directories excluded from the generated site
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - package*.json


# Jekyll Archives
jekyll-archives:
  enabled: [categories, tags]

  layouts:
    category: category
    tag: tag

  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
